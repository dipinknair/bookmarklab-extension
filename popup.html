<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookmarkLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root, [data-mode="dark"] {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #161b22;
      --border-color: rgba(255, 255, 255, 0.1);
      --border-color-hover: rgba(255, 255, 255, 0.22);
      --text-primary: #f0f6fc;
      --text-muted: #6e7681;
      --text-secondary: #8b949e;
      --header-bg: #161b22;
      --bg-badge: rgba(255, 255, 255, 0.05);
      --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    [data-mode="light"] {
      --bg-primary: #f6f8fa;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --border-color: rgba(0, 0, 0, 0.08);
      --border-color-hover: rgba(0, 0, 0, 0.18);
      --text-primary: #1f2328;
      --text-muted: #6e7781;
      --text-secondary: #57606a;
      --header-bg: #ffffff;
      --bg-badge: rgba(0, 0, 0, 0.04);
      --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    :root, [data-theme="purple"] {
      --accent-primary: #7d85d8;
      --accent-primary-hover: #6c74cb;
      --accent-gradient: linear-gradient(135deg, #747ecf, #8b94df, #a2abed);
      --accent-emerald: #5fa88d;
      --accent-amber: #d49f69;
      --accent-violet: #8890df;
      --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --shadow-glow: none;
    }

    [data-theme="emerald"] {
      --accent-primary: #5fa88d;
      --accent-primary-hover: #50977d;
      --accent-gradient: linear-gradient(135deg, #589f85, #6eb49b, #87c7b0);
      --shadow-glow: none;
    }

    [data-theme="cyan"] {
      --accent-primary: #5c97b8;
      --accent-primary-hover: #4e88a8;
      --accent-gradient: linear-gradient(135deg, #5590b0, #6ba3c2, #84bad6);
      --shadow-glow: none;
    }

    [data-theme="gold"] {
      --accent-primary: #c9935d;
      --accent-primary-hover: #b9824c;
      --accent-gradient: linear-gradient(135deg, #c28952, #d49f69, #e5b686);
      --shadow-glow: none;
    }

    [data-theme="rose"] {
      --accent-primary: #c9788a;
      --accent-primary-hover: #b86779;
      --accent-gradient: linear-gradient(135deg, #c06d80, #d28394, #e39dac);
      --shadow-glow: none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 380px;
    }

    /* Header */
    .popup-header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 14px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .popup-logo {
      width: 26px;
      height: 26px;
      background: transparent;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: none;
    }

    .popup-logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .popup-logo .logo-tile {
      fill: #2B2D2A;
      transition: fill 0.15s ease;
    }

    .popup-logo .logo-ribbon {
      fill: var(--accent-primary);
      transition: fill 0.15s ease;
    }

    .theme-selector {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 5px;
      background: var(--bg-badge);
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .theme-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--dot-color);
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      transition: opacity 0.15s ease;
    }

    .theme-dot:hover { opacity: 0.8; }
    .theme-dot.active { outline: 2px solid var(--accent-primary); outline-offset: 1px; }

    .theme-mode-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--bg-badge);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      flex-shrink: 0;
    }

    .theme-mode-btn:hover {
      border-color: var(--border-color-hover);
      color: var(--text-primary);
    }

    [data-mode="dark"] .theme-mode-btn .icon-sun { display: block; }
    [data-mode="dark"] .theme-mode-btn .icon-moon { display: none; }
    [data-mode="light"] .theme-mode-btn .icon-sun { display: none; }
    [data-mode="light"] .theme-mode-btn .icon-moon { display: block; }

    .popup-brand {
      flex: 1;
    }

    .popup-brand-name {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      display: block;
    }

    .popup-brand-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 1px;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      background: var(--accent-emerald);
      border-radius: 50%;
      animation: live-pulse 2s ease-in-out infinite;
    }

    @keyframes live-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Stats Grid */
    .popup-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 14px 14px 10px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      transition: border-color 0.15s ease;
    }

    .stat-card:hover {
      border-color: var(--border-color-hover);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .stat-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-card.dupes .stat-value { color: var(--accent-amber); }
    .stat-card.tracking .stat-value { color: var(--accent-violet); }

    /* Divider */
    .popup-divider {
      height: 1px;
      background: var(--border-color);
      margin: 2px 14px 10px;
    }

    /* Quick Actions */
    .popup-actions-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0 14px;
      margin-bottom: 6px;
    }

    .popup-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 14px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: left;
      width: 100%;
    }

    .action-btn:hover {
      background: var(--bg-badge);
      border-color: var(--border-color-hover);
      color: var(--accent-primary);
    }

    .action-btn .action-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .action-btn.dedupe .action-icon { background: rgba(201, 147, 93, 0.15); color: var(--accent-amber); }
    .action-btn.cluster .action-icon { background: rgba(125, 133, 216, 0.15); color: var(--accent-primary); }
    .action-btn.clean .action-icon { background: rgba(136, 144, 223, 0.15); color: var(--accent-violet); }

    .action-btn-text {
      flex: 1;
    }

    .action-btn-title {
      display: block;
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--text-primary);
    }

    .action-btn-sub {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-top: 1px;
    }

    /* CTA Button */
    .popup-footer {
      padding: 10px 14px 14px;
    }

    .btn-launch {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 9px 14px;
      background: var(--accent-primary);
      border: 1px solid var(--accent-primary);
      border-radius: 8px;
      color: white;
      font-family: var(--font-sans);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      letter-spacing: -0.01em;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .btn-launch:hover {
      background: var(--accent-primary-hover, #6c74cb);
      border-color: var(--accent-primary-hover, #6c74cb);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .btn-launch:active {
      opacity: 0.9;
    }

    /* Loading state */
    #popup-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 28px 14px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #popup-content { display: none; }

    #popup-error {
      display: none;
      padding: 12px 14px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      margin: 12px 14px;
      font-size: 0.78rem;
      color: #fca5a5;
    }
  </style>
</head>
<body>

  <!-- Popup Header -->
  <div class="popup-header">
    <div class="popup-logo" title="BookmarkLab">
      <svg width="24" height="24" viewBox="130 130 768 768" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="logo-tile" fill="#2B2D2A" d="M282.151 141.207C291.786 140.545 305.557 140.889 315.428 140.889L374.283 140.906L556.369 140.911L684.73 140.918L720.703 140.888C733.162 140.879 745.12 140.648 757.49 142.655C829.034 154.265 883.894 216.582 885.049 289.354C885.207 299.277 885.3 309.178 885.362 319.092C885.482 342.14 885.484 365.189 885.371 388.237L885.338 561.174L885.184 686.166C885.093 717.323 887.623 748.333 877.836 778.272C857.794 839.587 809.516 876.657 746.101 884.379C745.172 884.476 744.241 884.56 743.309 884.631C733.605 885.382 720.912 885.021 710.948 885.017L658.028 885.012L488.055 885.005L348.899 884.964L309.32 885.005C294.341 885.023 281.655 885.378 266.755 882.79C239.149 877.929 213.397 865.614 192.284 847.176C162.414 821.168 143.986 784.444 140.986 744.952C140.168 733.709 140.499 719.841 140.496 708.399L140.49 649.413L140.461 464.135L140.448 340.745L140.424 304.613C140.421 290.909 140.038 280.915 142.358 267.214C146.88 240.1 158.763 214.748 176.709 193.926C204.284 162.084 240.189 144.252 282.151 141.207Z"/>
        <path class="logo-ribbon" fill="var(--accent-primary)" d="M361.332 298.153L361.987 298.119C381.853 297.185 407.778 297.865 427.893 297.864L550.249 297.869L625.846 297.95C638.609 297.932 651.955 297.72 664.716 298.158C669.124 298.66 673.466 300.885 676.7 303.877C680.948 307.807 683.087 313.669 683.154 319.409C683.511 350.145 683.293 380.885 683.227 411.623L683.262 560.206L683.295 656.699L683.318 685.905C683.36 696.396 685.26 710.953 677.613 718.856C674.049 722.606 669.08 724.695 663.907 724.618C661.588 724.589 657.568 723.694 655.869 722.209C649.002 716.206 641.742 708.657 635.274 702.213L588.973 655.9L547.448 614.42C535.871 602.961 523.61 591.196 512.515 579.285C488.486 604.37 461.586 630.302 436.843 655.103L398.052 693.898C389.472 702.524 376.566 716.526 366.401 724.008C363.896 725.852 355.822 724.192 352.841 722.341C341.635 715.384 342.211 703.881 342.582 692.385C342.705 686.355 342.592 679.934 342.598 673.847L342.579 596.349L342.566 412.368L342.673 350.435C342.686 340.638 342.516 330.833 342.621 321.036C342.753 308.648 349.025 300.509 361.332 298.153Z"/>
      </svg>
    </div>
    <div class="popup-brand">
      <span class="popup-brand-name">BookmarkLab</span>
      <span class="popup-brand-sub">
        <span class="live-dot"></span>
        Live Chrome Bookmarks
      </span>
    </div>
    <!-- Theme Accent Picker -->
    <div class="theme-selector" title="Choose Accent Theme">
      <button class="theme-dot active" data-theme="purple" style="--dot-color: #858ee0;" title="Pastel Lavender (Default)"></button>
      <button class="theme-dot" data-theme="emerald" style="--dot-color: #6eb49b;" title="Pastel Sage"></button>
      <button class="theme-dot" data-theme="cyan" style="--dot-color: #6ba3c2;" title="Pastel Mist Blue"></button>
      <button class="theme-dot" data-theme="gold" style="--dot-color: #d49f69;" title="Pastel Sand"></button>
      <button class="theme-dot" data-theme="rose" style="--dot-color: #d28394;" title="Pastel Dusty Rose"></button>
    </div>

    <!-- Mode Toggle (Dark / Light) -->
    <button class="theme-mode-btn" title="Switch Theme Mode" aria-label="Switch Theme Mode">
      <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>

  <!-- Loading State -->
  <div id="popup-loading">
    <div class="spinner"></div>
    Loading your bookmarks…
  </div>

  <!-- Error State -->
  <div id="popup-error"></div>

  <!-- Main Content -->
  <div id="popup-content">

    <!-- Stats Cards -->
    <div class="popup-stats">
      <div class="stat-card">
        <div class="stat-value" id="stat-total">—</div>
        <div class="stat-label">Total Bookmarks</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-folders">—</div>
        <div class="stat-label">Folders</div>
      </div>
      <div class="stat-card dupes">
        <div class="stat-value" id="stat-dupes">—</div>
        <div class="stat-label">Duplicates</div>
      </div>
      <div class="stat-card tracking">
        <div class="stat-value" id="stat-tracking">—</div>
        <div class="stat-label">Tracking Tags</div>
      </div>
    </div>

    <div class="popup-divider"></div>

    <!-- Quick Actions -->
    <div class="popup-actions-label">Quick Actions</div>
    <div class="popup-actions">
      <button class="action-btn dedupe" id="btn-quick-dedupe">
        <div class="action-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </div>
        <div class="action-btn-text">
          <span class="action-btn-title">Find & Remove Duplicates</span>
          <span class="action-btn-sub">Detect all duplicate bookmarks</span>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted)"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <button class="action-btn cluster" id="btn-quick-cluster">
        <div class="action-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div class="action-btn-text">
          <span class="action-btn-title">Auto-Cluster by Category</span>
          <span class="action-btn-sub">Organize bookmarks into folders</span>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted)"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <button class="action-btn clean" id="btn-quick-clean">
        <div class="action-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </div>
        <div class="action-btn-text">
          <span class="action-btn-title">Clean Tracking URLs</span>
          <span class="action-btn-sub">Strip utm_*, fbclid, gclid params</span>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted)"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

  </div>

  <!-- Footer: Open Full Dashboard -->
  <div class="popup-footer">
    <button class="btn-launch" id="btn-open-dashboard">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Open Full Dashboard
    </button>
  </div>

  <script type="module" src="js/popup.js"></script>
</body>
</html>
